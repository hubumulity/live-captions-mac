name: Build macOS app

on:
  push:
    branches:
      - "master"
    paths:
      - "LiveCaptions/**"
      - "ci/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 每次 master 有代码提交：最新 v* tag 的 patch 位 +1，打 tag 并推送。
  # 注意：GITHUB_TOKEN 推送的 tag 不会再触发 workflow（GitHub 防循环限制），
  # 所以构建 + 发版都在同一次 run 里完成（见 build 任务），不依赖 tag 事件。
  version:
    runs-on: ubuntu-latest
    concurrency:
      group: autotag-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Bump patch version and push tag
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags origin
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          else
            tag="v0.1.0"
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists, reuse it"
          else
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" tag "$tag"
            git push origin "$tag" || echo "tag push raced with another run, reuse existing"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Toolchain info
        run: swift --version && xcodebuild -version

      - name: Build and package LiveCaptions.app (arm64)
        shell: bash
        env:
          ARCH: arm64
          VERSION: ${{ needs.version.outputs.version }}
        run: chmod +x ci/build-app.sh && ci/build-app.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptions-macOS15-arm64
          path: dist/LiveCaptions-macOS15-arm64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            dist/LiveCaptions-macOS15-arm64.zip \
            --title "Live Captions ${{ needs.version.outputs.tag }}" \
            --generate-notes
