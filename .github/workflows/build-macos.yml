name: Build macOS app

on:
  push:
    paths:
      - "LiveCaptions/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: LiveCaptions
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Toolchain info
        run: swift --version && xcodebuild -version

      - name: Build (release, Swift 6 strict concurrency)
        shell: bash
        run: swift build -c release 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: LiveCaptions/build.log

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptions-binary
          path: LiveCaptions/.build/release/LiveCaptions
